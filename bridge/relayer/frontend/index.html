<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amadeus TRUSTLESS Bridge</title>
<link rel="icon" href="./logos/favicon.svg">
<style>
  :root { --bg: #f4f5f7; --card: #fff; --line: #e3e5ea; --text: #15171c; --muted: #6b7180; --accent: #1f6feb; --ok: #1a7f37; --warn: #b26b00; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  header img { width: 32px; height: 32px; }
  header h1 { font-size: 20px; margin: 0; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #fff3cd; color: #7a5600; border: 1px solid #f1d78a; }
  .badge.mainnet { background: #e6f4ea; color: var(--ok); border-color: #b7dfc2; }
  .tl { color: #00b8a9; letter-spacing: .5px; }
  .note { font-size: 12px; color: var(--muted); margin: -6px 0 14px; }
  .note a { color: var(--muted); }
  .note .free { color: var(--ok); }
  .wallets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .wallet { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; font: inherit; text-align: left; color: var(--text); }
  .wallet:hover { border-color: #c6cbd5; }
  .wallet img { width: 28px; height: 28px; border-radius: 6px; flex: none; }
  .wallet .name { font-weight: 600; font-size: 14px; }
  .wallet .who { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
  .wallet.on .who { color: var(--ok); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .side { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: #fafbfc; }
  .side .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px; }
  .pick { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .chainbig { display: inline-flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
  .chainbig img { width: 40px; height: 40px; border-radius: 50%; }
  .chainbig .k { display: block; font-size: 11px; font-weight: 400; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .picker { position: relative; }
  .chainbtn { display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border: 1.5px solid #d5dae3; border-radius: 12px; background: #fff; font: inherit; color: var(--text); cursor: pointer; text-align: left; }
  .chainbtn:hover, .chainbtn.open { border-color: var(--accent); }
  .chainbtn img { width: 36px; height: 36px; border-radius: 50%; }
  .chainbtn b { display: block; font-size: 17px; }
  .chainbtn .k { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .chainbtn .chev { margin-left: 6px; color: var(--muted); font-size: 12px; }
  .chainbtn.fixed { cursor: default; }
  .chainbtn.fixed:hover { border-color: #d5dae3; }
  .menu { position: absolute; z-index: 10; top: calc(100% + 6px); left: 0; min-width: 330px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(20, 25, 40, .14); padding: 6px; }
  .opt { white-space: nowrap; display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: none; font: 600 15px system-ui, sans-serif; color: var(--text); cursor: pointer; text-align: left; }
  .opt img { width: 28px; height: 28px; border-radius: 50%; }
  .opt:hover:not(:disabled) { background: #eef3fd; }
  .opt.sel { background: #e7effd; }
  .opt .tick { margin-left: auto; color: var(--accent); }
  .opt small { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--muted); }
  .opt:disabled { cursor: default; color: var(--muted); }
  .opt:disabled img { opacity: .45; }
  .flabel { display: block; font-size: 12px; font-weight: 600; color: #3d4352; margin: 10px 0 5px; }
  .field { display: flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid #d5dae3; border-radius: 10px; padding: 8px 12px; }
  .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(31, 111, 235, .15); }
  .field.readonly { background: #f1f3f6; border-style: dashed; }
  .field .unit { font-weight: 600; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px 9px 8px; border-radius: 99px; background: #fff; border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
  .pill img { width: 22px; height: 22px; border-radius: 50%; }
  .pill .coin { margin-right: 9px; }
  .pill .k { font-weight: 400; color: var(--muted); font-size: 12px; }
  .pill select { border: 0; background: transparent; font: inherit; font-weight: 600; padding: 0; cursor: pointer; }
  .coin { position: relative; width: 28px; height: 28px; }
  .coin img:first-child { width: 28px; height: 28px; }
  .coin img.small { position: absolute; right: -9px; bottom: -3px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; background: #fff; }
  .amount input { flex: 1; min-width: 0; border: 0; background: transparent; font: 600 24px system-ui, sans-serif; color: var(--text); outline: none; padding: 0; }
  .amount input::placeholder { color: #b3b9c5; }
  .amount .out { flex: 1; font: 600 24px system-ui, sans-serif; color: var(--text); }
  .amount #max { border: 1px solid #c9d7f3; border-radius: 6px; background: #eef3fd; color: var(--accent); font: 600 12px system-ui, sans-serif; padding: 3px 8px; cursor: pointer; }
  .bal { font-size: 12px; color: var(--muted); margin-top: 5px; min-height: 16px; }
  .flip { display: flex; justify-content: center; margin: -6px 0; position: relative; z-index: 1; }
  .flip button { width: 38px; height: 38px; border-radius: 10px; border: 4px solid var(--card); background: #e9edf5; font-size: 18px; cursor: pointer; }
  .flip button:hover { background: #dbe3f1; }
  .recipient { flex: 1; min-width: 0; border: 0; outline: none; padding: 2px 0; font: 13px ui-monospace, monospace; background: transparent; color: var(--text); }
  .recipient::placeholder { color: #9aa1ae; }
  .delivery { margin: 12px 0 4px; display: grid; gap: 6px; }
  .drop { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; cursor: pointer; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fafbfc; }
  .drop input { width: 17px; height: 17px; accent-color: var(--accent); }
  .drop small { color: var(--muted); font-size: 12px; }
  .summary { font-size: 13px; color: var(--muted); margin: 10px 2px 0; display: grid; gap: 2px; }
  .summary div { display: flex; justify-content: space-between; }
  .summary .total { color: var(--text); font-weight: 600; }
  .summary .costs { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 6px; }
  .summary .costs span[title] { cursor: help; }
  .summary .costs b { color: var(--text); font-weight: 600; }
  .summary .dot { color: #c4c9d3; }
  .go { width: 100%; margin-top: 12px; padding: 13px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: 600 16px system-ui, sans-serif; cursor: pointer; }
  .go:disabled { background: #aab3c5; cursor: default; }
  h2 { font-size: 15px; margin: 22px 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  td, th { padding: 7px 8px; border-bottom: 1px solid #eef0f3; text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td img { width: 16px; height: 16px; vertical-align: -3px; border-radius: 50%; }
  .st { display: inline-block; font-size: 12px; line-height: 1.35; padding: 2px 8px; border-radius: 8px; }
  .st.done { background: #e6f4ea; color: var(--ok); } .st.wait { background: #fff3cd; color: var(--warn); }
  td button { border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; padding: 3px 9px; cursor: pointer; }
  .relay { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .relay a { color: var(--muted); }
  details { margin-top: 18px; font-size: 13px; color: var(--muted); }
  #log { white-space: pre-wrap; font: 12px ui-monospace, monospace; color: #444; margin-top: 6px; }
  @media (max-width: 480px) { .wallets { grid-template-columns: 1fr; } }
</style>
<!-- filled in by the worker for this network (worker/index.js) -->
<script id="config" type="application/json">{}</script>
</head>
<body>
<main>
  <header>
    <img src="./logos/ama.svg" alt="">
    <h1>Amadeus <span class="tl">TRUSTLESS</span> Bridge</h1>
    <span class="badge" id="network"></span>
  </header>

  <p class="note"><b class="free">Feeless</b> · verified on-chain by light clients on both sides (<a id="lc-link" target="_blank" rel="noopener">contracts</a>) · relay optional: delivery + gas drop</p>

  <div class="wallets">
    <button class="wallet" id="connect-ama"><img src="./logos/ama-wallet.png" alt=""><span><div class="name">Amadeus wallet</div><div class="who" id="ama-account">Connect</div></span></button>
    <button class="wallet" id="connect-evm"><img src="./logos/metamask.svg" alt=""><span><div class="name">MetaMask</div><div class="who" id="evm-account">Connect</div></span></button>
  </div>

  <div class="card">
    <div class="side">
      <div class="label">From</div>
      <div class="pick" id="from-pick"></div>
      <label class="flabel" for="amount">Amount</label>
      <div class="field amount"><input id="amount" inputmode="decimal" placeholder="0.0" autocomplete="off"><span class="unit" id="amount-unit"></span><button id="max" type="button">Max</button></div>
      <div class="bal" id="from-balance"></div>
    </div>
    <div class="flip"><button id="flip" title="Switch direction">⇅</button></div>
    <div class="side">
      <div class="label">To</div>
      <div class="pick" id="to-pick"></div>
      <div class="flabel">You receive</div>
      <div class="field amount readonly"><div class="out" id="receive">0.0</div><span class="unit" id="receive-unit"></span></div>
      <label class="flabel" for="recipient">Recipient address</label>
      <div class="field"><input class="recipient" id="recipient" autocomplete="off" spellcheck="false"></div>
    </div>

    <div class="delivery" id="delivery"></div>
    <div class="summary" id="summary"></div>
    <button class="go" id="go" disabled>Connect a wallet</button>
    <div class="relay" id="relay-status"></div>
  </div>

  <h2>Recent orders</h2>
  <table><thead><tr><th>Route</th><th>#</th><th>Amount</th><th>To</th><th>Delivery</th><th>Status</th></tr></thead><tbody id="orders"></tbody></table>

  <details><summary>Activity</summary><div id="log"></div></details>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
