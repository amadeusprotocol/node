[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./test/vectors" }, { access = "read", path = "./deploy" }]

[rpc_endpoints]
bsc_testnet = "https://bsc-testnet-rpc.publicnode.com"
